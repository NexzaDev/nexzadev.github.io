name: Sync GitHub data

on:
   schedule:
      - cron: "30 6 * * 1"
   workflow_dispatch:

permissions:
   contents: write
   pull-requests: write

concurrency:
   group: sync-live-data
   cancel-in-progress: false

jobs:
   sync:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out the project
           uses: actions/checkout@v4

         - name: Set up Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 20
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Fetch public GitHub data for NexzaDev
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: node scripts/sync-live-data.js

         - name: Validate generated data
           run: npm run validate:data

         - name: Open or update the data review pull request
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              if git diff --quiet -- data/; then
                 echo "No GitHub data changes."
                 exit 0
              fi
              branch="automation/sync-live-data"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git switch -C "$branch"
              git add data/achievements.json data/github-contributions.json data/news.json
              git commit -m "chore: sync public GitHub data"
              git push --force origin "$branch"
              number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
              if [ -z "$number" ]; then
                 gh pr create --base main --head "$branch" \
                    --title "chore: sync public GitHub data" \
                    --body "Weekly public GitHub contribution and activity data refresh for NexzaDev. Review the generated data before merging."
              fi
