name: Portfolio CI/CD

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]
   workflow_dispatch:

# Concurrency is set per job, so a PR push that supersedes an older run never
# cancels a build already on its way to main.
jobs:
   ci:
      concurrency:
         group: "ci-${{ github.ref }}"
         # A newer PR push supersedes the old run; runs on main queue instead.
         cancel-in-progress: ${{ github.event_name == 'pull_request' }}
      permissions:
         contents: read
      runs-on: ubuntu-latest
      timeout-minutes: 20
      env:
         # Only main deploys, so only main uploads the Pages artifact.
         DEPLOY: ${{ github.ref == 'refs/heads/main' }}
      steps:
         - name: Checkout code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

         - name: Setup Node.js
           uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
           with:
              # The floor in package.json engines; npm is the only package
              # manager this repository uses, and the install must stay
              # free of native binaries so Termux works too.
              node-version: 20
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Check formatting
           run: npm run format:check

         - name: Lint code and scripts
           run: npm run lint

         - name: Type-check
           run: npm run type-check

         - name: Validate portfolio data
           run: npm run validate:data

         - name: Run tests
           run: npm test

         - name: Security audit
           run: npm audit --audit-level=high

         - name: Build with Vite
           run: npm run build

         - name: Setup Pages
           if: env.DEPLOY == 'true'
           uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

         - name: Upload Pages artifact
           if: env.DEPLOY == 'true'
           uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
           with:
              path: build

   deploy:
      # Never for another ref: a dispatch on a feature branch runs CI only.
      if: >
         !cancelled() && needs.ci.result == 'success' &&
         github.ref == 'refs/heads/main'
      needs: ci
      # One deploy at a time, never cancelled half-way.
      concurrency:
         group: pages
         cancel-in-progress: false
      runs-on: ubuntu-latest
      permissions:
         contents: read
         pages: write
         id-token: write
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - name: Deploy to GitHub Pages
           id: deployment
           uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
